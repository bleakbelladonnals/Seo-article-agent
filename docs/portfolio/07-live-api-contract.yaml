openapi: 3.1.0
info:
  title: LumaFlow Content Operations API (future contract)
  version: 2.0.0
  description: >-
    Future adapter contract only. The published portfolio uses a typed deterministic
    mock and does not call these endpoints.
paths:
  /api/v2/workflow-runs:
    post:
      summary: Start a version-pinned five-agent workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
  /api/v2/workflow-runs/{runId}:
    get:
      summary: Read task status, findings, scores and lineage
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
  /api/v2/workflow-runs/{runId}/findings/{findingId}:
    patch:
      summary: Record an apply, dismiss or manual decision
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: findingId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { enum: [apply, dismiss, manual] }
                replacement: { type: string }
      responses:
        '200': { description: Decision stored }
  /api/v2/workflow-runs/{runId}/approval:
    post:
      summary: Approve only when critical findings are resolved
      responses:
        '201':
          description: Immutable V2 asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVersion'
        '409': { description: Approval gate blocked }
components:
  schemas:
    StartRunRequest:
      type: object
      required: [productId, brief, knowledgeVersion, promptVersions]
      properties:
        productId: { const: phk-01 }
        brief:
          type: object
          required: [keyword, audience, language]
          properties:
            keyword: { type: string }
            audience: { type: string }
            language: { type: string }
        knowledgeVersion: { type: string }
        promptVersions:
          type: array
          items: { type: string }
        requestedModelRoute:
          type: array
          items: { type: string }
    Lineage:
      type: object
      required: [knowledgeVersion, sourceVersions, promptVersions, modelRoute]
      properties:
        knowledgeVersion: { type: string }
        sourceVersions:
          type: array
          items: { type: string }
        promptVersions:
          type: array
          items: { type: string }
        modelRoute:
          type: array
          items: { type: string }
    WorkflowRun:
      type: object
      required: [id, status, tasks, findings, qualityScore, geoScore, lineage]
      properties:
        id: { type: string }
        status: { enum: [idle, running, failed, in_review, approved] }
        tasks:
          type: array
          items:
            type: object
            required: [agentId, promptVersion, status, inputEvidenceIds, outputSchema]
            properties:
              agentId: { type: string }
              promptVersion: { type: string }
              status: { enum: [waiting, running, completed, failed] }
              inputEvidenceIds:
                type: array
                items: { type: string }
              outputSchema: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, dimension, severity, status]
            properties:
              id: { type: string }
              dimension: { enum: [fact, seo, geo, brand] }
              severity: { enum: [critical, warning, suggestion] }
              status: { enum: [open, applied, dismissed, manual] }
        qualityScore: { type: integer }
        geoScore: { type: integer, description: LumaFlow internal rubric }
        lineage: { $ref: '#/components/schemas/Lineage' }
    AssetVersion:
      type: object
      required: [assetId, version, article, reviewDecisions, lineage, approvedBy]
      properties:
        assetId: { type: string }
        version: { const: V2 }
        article: { type: string }
        reviewDecisions:
          type: array
          items: { type: object }
        lineage: { $ref: '#/components/schemas/Lineage' }
        approvedBy: { type: string }
